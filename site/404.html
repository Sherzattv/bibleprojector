<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Страница не найдена — Bible Projector</title>
  <meta name="description" content="Такой страницы на bibleprojector.kz нет. Вернитесь на главную или откройте приложение." />
  <!-- Мусорные адреса не должны попадать в индекс: страница отдаётся с кодом 404,
       но краулеры доходят сюда и по ссылкам из чужих кэшей. -->
  <meta name="robots" content="noindex" />
  <link rel="icon" type="image/svg+xml" href="/app/favicon.svg" />
  <style>
    /* Палитра и типографика продублированы из index.html: лендинг намеренно
       без сборки и без общего CSS-файла, чтобы каждая страница грузилась одним
       запросом. При правке цветов меняйте оба файла. */
    :root {
      --bg: #0b0c0e;
      --panel: #111316;
      --stroke: #22262c;
      --ink: #e8eaed;
      --muted: #9aa0a8;
      --faint: #7d8694;
      --accent: #4f83f1;
      --go: #2f9e63;
      --amber: #d8a94e;
    }
    * { box-sizing: border-box; margin: 0; }
    body {
      background: var(--bg);
      color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      line-height: 1.55;
      -webkit-font-smoothing: antialiased;
    }
    a { color: var(--accent); text-decoration: none; }
    .wrap { max-width: 880px; margin: 0 auto; padding: 0 24px; }
    header.site {
      display: flex; align-items: center; justify-content: space-between;
      padding: 20px 0;
    }
    .brand { display: flex; align-items: center; gap: 10px; font-weight: 650; font-size: 16px; }
    .brand svg { color: var(--accent); }
    .hero { padding: 72px 0 56px; }
    .code {
      font-family: ui-monospace, 'SF Mono', Consolas, monospace;
      font-size: 13px; letter-spacing: 0.14em; text-transform: uppercase;
      color: var(--amber);
    }
    .hero h1 {
      margin-top: 12px;
      font-size: clamp(30px, 5vw, 44px);
      line-height: 1.15;
      letter-spacing: -0.02em;
      max-width: 17ch;
      text-wrap: balance;
    }
    .hero p.lead {
      margin-top: 18px; max-width: 52ch;
      font-size: 17px; color: var(--muted);
    }
    .cta-row { margin-top: 32px; display: flex; gap: 14px; align-items: center; flex-wrap: wrap; }
    .cta {
      display: inline-block;
      background: var(--go); color: #fff;
      font-weight: 700; font-size: 16px;
      padding: 12px 28px; border-radius: 8px;
    }
    .cta:hover { filter: brightness(1.08); }
    .cta-ghost {
      display: inline-block;
      border: 1px solid var(--stroke); background: var(--panel);
      color: var(--ink); font-weight: 650; font-size: 16px;
      padding: 12px 24px; border-radius: 8px;
    }
    .cta-ghost:hover { border-color: var(--accent); }
    footer.site {
      border-top: 1px solid var(--stroke);
      padding: 24px 0 40px;
      font-size: 13px; color: var(--faint);
      display: flex; justify-content: space-between; gap: 16px; flex-wrap: wrap;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header class="site">
      <a class="brand" href="/">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 7.75a.75.75 0 0 1 1.142-.638l3.664 2.249a.75.75 0 0 1 0 1.278l-3.664 2.25a.75.75 0 0 1-1.142-.64z"/><path d="M12 17v4"/><path d="M8 21h8"/><rect x="2" y="3" width="20" height="14" rx="2"/></svg>
        Bible Projector
      </a>
      <a href="/app/">Открыть приложение →</a>
    </header>

    <section class="hero">
      <p class="code">Ошибка 404</p>
      <h1>Такой страницы здесь нет</h1>
      <p class="lead">
        Ссылка устарела или в адресе опечатка. Ничего не сломалось —
        приложение на месте и работает как обычно.
      </p>
      <div class="cta-row">
        <a class="cta" href="/app/">Открыть приложение</a>
        <a class="cta-ghost" href="/">На главную</a>
      </div>
    </section>

    <footer class="site">
      <span>Bible Projector · Синодальный, Новый русский, қазақша, кыргызча</span>
      <a href="https://github.com/Sherzattv/bibleprojector">Открытый код на GitHub</a>
    </footer>
  </div>
</body>
</html>
