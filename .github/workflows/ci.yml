name: CI

on:
  push:
    branches: [main]
  pull_request:

# Новый пуш отменяет устаревший прогон той же ветки
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  production:
    name: v3 — production build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx wrangler deploy --dry-run

  v3:
    name: v3 — типы и тесты
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: v3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: v3/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm test
      # E2E (Playwright) гоняются локально перед релизом: cd v3 && npm run test:e2e
      # (решение владельца: браузерные тесты не входят в CI)
