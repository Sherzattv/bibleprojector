name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  legacy-tests:
    name: Тесты старой версии (app/)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx vitest run

  v3:
    name: v3 — типы, тесты, сборка
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: v3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: v3/package-lock.json
      - run: npm ci
      - run: npx svelte-check
      - run: npx vitest run
      - name: Конвертация данных и прод-сборка
        run: |
          npm run data
          npx vite build
